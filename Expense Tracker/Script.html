    // Persistent Cache implementation
    class ExpenseCache {
        constructor() {
            this.cacheKey = 'expense_app_cache';
            this.cacheDuration = 24 * 60 * 60 * 1000; // 24 hours for persistent cache
            this.shortCacheDuration = 3 * 60 * 1000; // 3 minutes for frequently changing data (multi-user sync)
            this.loadFromStorage();
        }

        loadFromStorage() {
            try {
                const stored = localStorage.getItem(this.cacheKey);
                this.cache = stored ? new Map(JSON.parse(stored)) : new Map();
                // Clean expired items
                const now = Date.now();
                this.cache.forEach((item, key) => {
                    if (now - item.timestamp > this.cacheDuration) {
                        this.cache.delete(key);
                    }
                });
            } catch (e) {
                this.cache = new Map();
            }
        }

        saveToStorage() {
            try {
                localStorage.setItem(this.cacheKey, JSON.stringify(Array.from(this.cache.entries())));
            } catch (e) { console.error("Cache Save Error", e); }
        }

        set(key, data) {
            this.cache.set(key, {
                data: data,
                timestamp: Date.now()
            });
            this.saveToStorage();
        }

        get(key) {
            const item = this.cache.get(key);
            if (!item) return null;

            const duration = (key === 'all_data' || key.startsWith('monthly_')) ? this.shortCacheDuration : this.cacheDuration;
            if (Date.now() - item.timestamp > duration) {
                this.cache.delete(key);
                this.saveToStorage();
                return null;
            }

            return item.data;
        }

        invalidate(key) {
            this.cache.delete(key);
            this.saveToStorage();
        }

        invalidateAll() {
            this.cache.clear();
            localStorage.removeItem(this.cacheKey);
        }

        preloadCommonData() {
            const now = new Date();
            const currentMonth = MONTHS[now.getMonth()];
            const currentYear = now.getFullYear().toString();

            this.preloadMonthlyData(currentMonth);
            this.preloadYearlyData(currentYear);
            this.preloadAllData();
            this.preloadItemsList();
        }

        preloadMonthlyData(month) {
            const cacheKey = `monthly_${month}`;
            if (!this.get(cacheKey)) {
                google.script.run
                    .withSuccessHandler((data) => {
                        this.set(cacheKey, data);
                    })
                    .getMonthlyData(month);
            }
        }

        preloadYearlyData(year) {
            const cacheKey = `yearly_${year}`;
            if (!this.get(cacheKey)) {
                google.script.run
                    .withSuccessHandler((data) => {
                        this.set(cacheKey, data);
                    })
                    .getYearlyData(year);
            }
        }

        preloadAllData() {

            if (!this.get(cacheKey)) {
                google.script.run
                    .withSuccessHandler((data) => {
                        this.set(cacheKey, data);
                    })

        preloadItemsList() {
            const cacheKey = 'items_list';
            if (!this.get(cacheKey)) {
                google.script.run
                    .withSuccessHandler((data) => {
                        this.set(cacheKey, data);
                    })
                    .getItemList();
            }
        }
    }

    /**
     * Smoothly animates a numeric value inside an element from its current displayed
     * value to `endValue` over `duration` ms.
     * @param {HTMLElement} el       - Target DOM element
     * @param {number}      endValue - Final numerical value
     * @param {string}      type     - 'currency' or 'integer' (default 'integer')
     * @param {number}      duration - Animation length in ms (default 600)
     */
    function animateValue(el, endValue, type = 'integer', duration = 600) {
        if (!el) return;

        // Parse current displayed value as start point
        const rawText = el.textContent.replace(/[^\d.]/g, '');
        const startValue = parseFloat(rawText) || 0;
        const startTime = performance.now();

        // Ease-out cubic easing
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

        function step(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const current = startValue + (endValue - startValue) * easeOutCubic(progress);

            if (type === 'currency') {
                el.textContent = formatCurrency(current);
            } else {
                el.textContent = Math.round(current);
            }

            if (progress < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    // Modern Toast Notification

        const toastEl = document.getElementById('modernToast');
        const titleEl = document.getElementById('modernToastTitle');
        const bodyEl = document.getElementById('modernToastBody');
        const iconEl = document.getElementById('modernToastIcon');
        const wrapperEl = document.getElementById('modernToastIconWrapper');

        if (!toastEl || !titleEl || !bodyEl || !iconEl || !wrapperEl) {

            return;
        }

        titleEl.textContent = title;

        if (message) {
            bodyEl.innerHTML = message;
            bodyEl.style.display = 'block';
        } else {
            bodyEl.innerHTML = '';
            bodyEl.style.display = 'none';
        }

        let iconHtml = '<i class="fas fa-info-circle"></i>';
        let wrapperBg = 'rgba(99, 102, 241, 0.1)';
        let iconColor = '#6366f1';

        if (type === 'success') {
            iconHtml = '<i class="fas fa-check-circle"></i>';

            iconColor = '#10b981';
        } else if (type === 'danger' || type === 'error') {
            iconHtml = '<i class="fas fa-exclamation-circle"></i>';
            wrapperBg = 'rgba(239, 68, 68, 0.1)';
            iconColor = '#ef4444';
        } else if (type === 'warning') {
            iconHtml = '<i class="fas fa-exclamation-triangle"></i>';
            wrapperBg = 'rgba(245, 158, 11, 0.1)';
            iconColor = '#f59e0b';
        }

        wrapperEl.style.backgroundColor = wrapperBg;
        iconEl.style.color = iconColor;
        iconEl.innerHTML = iconHtml;

        // Force reflow

        toastEl.classList.add('show');

            clearTimeout(window.modernToastTimeout);

        window.modernToastTimeout = setTimeout(() => {

    // Utility functions
    function formatCurrency(num) {

        return new Intl.NumberFormat('en-IN', {
            style: 'currency',

    function formatDisplayDate(dateString) {
        if (!dateString) return '';

        // If it's already DD-MM-YYYY, return as is to avoid JS parsing bugs (where it assumes MM-DD-YYYY)
        if (typeof dateString === 'string' && dateString.match(/^\d{2}-\d{2}-\d{4}$/)) {
            return dateString;
        }

        try {
            const date = new Date(dateString);
            if (!isNaN(date.getTime())) {
                const day = date.getDate().toString().padStart(2, '0');
                const monthName = MONTHS[date.getMonth()];
                const year = date.getFullYear();

                return `${monthName} ${day}, ${year}`;
            }
            if (dateString.includes(' ')) {
                const parts = dateString.split(' ');
                if (parts.length >= 3) {
                    const monthName = parts[0];
                    const monthIndex = MONTHS.indexOf(monthName);
                    const month = monthIndex !== -1 ? (monthIndex + 1).toString().padStart(2, '0') : "01";
                    const day = parseInt(parts[1]).toString().padStart(2, '0');
                    const year = parts[2];
                    return `${day}-${month}-${year}`;
                } else if (parts.length >= 2) {
                    const monthName = parts[0];
                    const monthIndex = MONTHS.indexOf(monthName);
                    const month = monthIndex !== -1 ? (monthIndex + 1).toString().padStart(2, '0') : "01";
                    const day = parseInt(parts[1]).toString().padStart(2, '0');
                    const year = extractYearFromDate(dateString);
                    return `${day}-${month}-${year}`;
                }
            }
            if (dateString.includes('-')) {
                const [year, month, day] = dateString.split('-');
                const monthStr = parseInt(month).toString().padStart(2, '0');
                const paddedDay = parseInt(day).toString().padStart(2, '0');
                return `${paddedDay}-${monthStr}-${year}`;
            }
        } catch (e) {
            console.error("Error formatting date:", e);
        }
        return dateString;
    }

    function extractYearFromDate(dateString) {
        if (!dateString) return getCurrentYear();

        try {
            // Try parsing as Date object first
            const date = new Date(dateString);
            if (!isNaN(date.getTime())) {
                let year = date.getFullYear();
                return year.toString();
            }

            // Handle format "Jan 16 2024"
            if (dateString.includes(' ')) {
                const parts = dateString.split(' ');
                if (parts.length >= 3 && !isNaN(parseInt(parts[2]))) {
                    return parts[2];
                }
            }

            // Handle format "2026-01-16"
            if (dateString.includes('-')) {
                const yearMatch = dateString.match(/^(\d{4})/);
                if (yearMatch) {
                    return yearMatch[1];
                }
            }

            console.warn("Could not extract year from date:", dateString);
            return getCurrentYear(); // Default to current year

        } catch (e) {
            console.error("Error extracting year:", e, "from:", dateString);
            return getCurrentYear(); // Default to current year
        }
    }

    // Populate year selector with recent years and data-derived years
    function populateYearSelector() {
        const yearSelector = document.getElementById('year-selector'); // For Graphs?
        const yearFilter = document.getElementById('yearFilter');       // For Reports
        const summaryYear = document.getElementById('summary-year');   // For Data Summary
        const graphYear = document.getElementById('graph-year');       // For Graphs specific

        const startYear = 2021;
        const endYear = 2026;
        const currentYear = getCurrentYear();
        const yearsSet = new Set();

        // Add static range
        for (let year = startYear; year <= endYear; year++) {
            yearsSet.add(year.toString());
        }

        // Add years from data if available
        if (window.enhancedAllData && window.enhancedAllData.length > 0) {
            window.enhancedAllData.forEach(item => {
                if (item.year) {
                    const y = parseInt(item.year);
                    if (!isNaN(y) && y >= startYear) {
                        yearsSet.add(item.year.toString());
                    }
                }
            });
        }

        // Sort years descending
        const sortedYears = Array.from(yearsSet).sort((a, b) => b - a);

        // Helper to populate a select element
        const populateSelect = (selectElement, includeAllOption = false) => {
            if (!selectElement) return;

            const currentValue = selectElement.value;
            selectElement.innerHTML = '';

            if (includeAllOption) {
                const allOption = document.createElement('option');
                allOption.value = "";
                allOption.textContent = "All Years";
                selectElement.appendChild(allOption);
            }

            sortedYears.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (year === currentYear && !currentValue && !includeAllOption) {
                    option.selected = true;
                } else if (currentValue && year === currentValue) {
                    option.selected = true;
                }
                selectElement.appendChild(option);
            });
        };

        // Populate the dropdowns
        populateSelect(yearSelector);
        populateSelect(yearFilter, true); // Reports filter needs "All Years"
        populateSelect(summaryYear);
        populateSelect(graphYear, true); // Graphs might allow "All Years" or specific handling
    }

    function loadMonth(month, isBackground = false, forceRefresh = false) {
        currentDashboardPage = 1;
        const targetMonth = month || CURRENT_MONTH;
        CURRENT_MONTH = targetMonth; // Update context for all table actions

        const pageTitle = document.getElementById('page-title');
        const tableTitle = document.getElementById('table-title');

        if (pageTitle) pageTitle.textContent = `${targetMonth} Expenses`;

        else if (tableTitle) tableTitle.textContent = `${targetMonth} Expenses`;

        document.querySelectorAll('.month-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.textContent === targetMonth) btn.classList.add('active');
        });

        const loadingSpinner = document.getElementById('loading-spinner');
        const tableBody = document.getElementById('expense-table-body');

        if (!isBackground) {
            showStatSkeletons();
            showTableSkeletons('expense-table-body', 8);
        }

        const cacheKey = `monthly_${targetMonth}`;

        // 1. CHECK SERVER-INJECTED DATA (Fastest — only on initial load, skip on forceRefresh)
        if (!forceRefresh && window.SERVER_INITIAL_DATA && window.SERVER_INITIAL_DATA.month === targetMonth && window.SERVER_INITIAL_DATA.monthlyData) {
            console.log("Using injected month data for", targetMonth);
            const data = window.SERVER_INITIAL_DATA.monthlyData;
            window.SERVER_INITIAL_DATA.monthlyData = null; // Consume so future manual refreshes fetch fresh data
            window.expenseCache.set(cacheKey, data);
            handleMonthData(data);
            return;
        }

        // 2. CHECK PERSISTENT CACHE (skip on forceRefresh)
        if (!forceRefresh) {
            const cachedData = window.expenseCache.get(cacheKey);
            if (cachedData) {
                handleMonthData(cachedData);
                return;
            }
        }

        // 3. NETWORK FETCH
        google.script.run
            .withSuccessHandler((data) => {
                window.expenseCache.set(cacheKey, data);
                handleMonthData(data);
            })
            .withFailureHandler(handleError)
            .getMonthlyData(targetMonth);
    }

    function renderDashboardTable(data) {
        const tableBody = document.getElementById('expense-table-body');
        const paginationContainer = document.getElementById('dashboard-pagination');
        const pageInfo = document.getElementById('dashboard-page-info');
        if (!tableBody) return;

        // Assign stable S.N. to each row before sorting/reversing
        let allLatestData = data.map((row, index) => {
            let r = [...row];
            r.sn = index + 1; // S.N increments chronologically
            return r;
        });

        // Sorting and limiting to latest if no sort
        if (dashboardSortCol) {
            allLatestData.sort((a, b) => {
                let valA, valB;
                switch (dashboardSortCol) {
                    case 'sn': valA = a.sn; valB = b.sn; break;
                    case 'id': valA = String(a[1] || ''); valB = String(b[1] || ''); break;
                    case 'date': valA = new Date(a[2]); valB = new Date(b[2]); break;
                    case 'item': valA = String(a[4] || ''); valB = String(b[4] || ''); break;
                    case 'amount': valA = parseFloat(a[5]) || 0; valB = parseFloat(b[5]) || 0; break;
                    case 'credit': valA = String(a[6] || ''); valB = String(b[6] || ''); break;
                    case 'admin': valA = String(a[7] || ''); valB = String(b[7] || ''); break;
                    default: return 0;
                }

                if (valA < valB) return dashboardSortDir === 'asc' ? -1 : 1;
                if (valA > valB) return dashboardSortDir === 'asc' ? 1 : -1;
                return 0;
            });
        } else {
            allLatestData = allLatestData.reverse(); // Default: Newest first
        }

        const isMobile = window.innerWidth <= 768;
        let latestData;
        let totalPages = 1;
        const totalItems = allLatestData.length;

        if (isMobile) {
            // Mobile: Infinite scroll — store full dataset, render first batch
            mobileDashboardAllData = allLatestData;
            mobileDashboardLoadedCount = 0;
            latestData = [];

        } else {

            if (currentDashboardPage > totalPages) currentDashboardPage = totalPages;

            const startIndex = (currentDashboardPage - 1) * DASHBOARD_PER_PAGE;

    function appendDashboardBatch(tableBody) {
        if (!tableBody || isDashboardBatchLoading) return;
        const data = mobileDashboardAllData;
        const start = mobileDashboardLoadedCount;
        const end = Math.min(start + MOBILE_BATCH_SIZE, data.length);
        if (start >= data.length) return;

        isDashboardBatchLoading = true;

        // Remove existing sentinel if any
        const oldSentinel = tableBody.querySelector('.scroll-sentinel');
        if (oldSentinel) oldSentinel.remove();

        for (let i = start; i < end; i++) {
            const row = data[i];
            const sn = row.sn;

            const tr = document.createElement('tr');
            tr.classList.add('infinite-row-in');
            tr.innerHTML = `

                <td data-label="Date">${date}</td>
                <td data-label="Item List">${itemList}</td>
                <td data-label="Amount">${amount}</td>
                <td data-label="Credit & Remark">${creditDisplay}</td>
                <td data-label="Admin">${adminDisplay}</td>
                <td data-label="Actions"></td>
            `;

            const actionTd = tr.querySelector('td:last-child');
            const viewBtn = document.createElement('button');
            viewBtn.className = 'action-btn text-info me-1';
            viewBtn.innerHTML = '<i class="fas fa-eye"></i>';
            viewBtn.title = 'View Entry';
            viewBtn.onclick = () => viewEntryInDashboard(CURRENT_MONTH, uniqueId);
            actionTd.appendChild(viewBtn);
            const editBtn = document.createElement('button');
            editBtn.className = 'action-btn text-primary me-1';
            editBtn.innerHTML = '<i class="fas fa-edit"></i>';
            editBtn.title = 'Edit Entry';
            editBtn.onclick = () => editEntry(uniqueId, CURRENT_MONTH);
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'action-btn text-danger';
            deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
            deleteBtn.title = 'Delete Entry';
            deleteBtn.onclick = () => openDeleteModal(uniqueId, CURRENT_MONTH);
            actionTd.appendChild(editBtn);
            actionTd.appendChild(deleteBtn);
            tableBody.appendChild(tr);
        }
        mobileDashboardLoadedCount = end;
        isDashboardBatchLoading = false;

        // If more records exist, add a sentinel row to trigger next load
        if (end < data.length) {
            const sentinel = document.createElement('tr');
            sentinel.className = 'scroll-sentinel';
            sentinel.innerHTML = `
                <td colspan="8" class="scroll-sentinel-cell">
                    <span class="scroll-loading-dots"><i class="fas fa-circle-notch fa-spin"></i> Loading more…</span>
                    <span class="scroll-count-badge">${end} / ${data.length}</span>
                </td>`;
            tableBody.appendChild(sentinel);

            // Observe the sentinel using viewport intersection with generous rootMargin
            if (mobileDashboardObserver) mobileDashboardObserver.disconnect();
            mobileDashboardObserver = new IntersectionObserver((entries) => {
                if (entries[0] && entries[0].isIntersecting) {
                    mobileDashboardObserver.disconnect();
                    appendDashboardBatch(tableBody);
                }
            }, {
                root: null,
                rootMargin: '250px 0px 250px 0px',
                threshold: 0
            });
            mobileDashboardObserver.observe(sentinel);

            // Attach scroll listener fallback to container and window
            const container = tableBody.closest('.table-responsive');
            if (container && !container._hasMobileScrollListener) {
                container._hasMobileScrollListener = true;
                container.addEventListener('scroll', () => {
                    if (container.scrollHeight - container.scrollTop - container.clientHeight < 250) {
                        if (mobileDashboardLoadedCount < mobileDashboardAllData.length && !isDashboardBatchLoading) {
                            appendDashboardBatch(tableBody);
                        }
                    }
                }, { passive: true });
            }
        } else {
            // All loaded — show total count footer
            const footer = document.createElement('tr');
            footer.className = 'scroll-sentinel';
            footer.innerHTML = `
                <td colspan="8" class="scroll-sentinel-cell scroll-end">
                    <i class="fas fa-check-circle" style="color:var(--success-color);"></i>
                    All ${data.length} records loaded
                </td>`;
            tableBody.appendChild(footer);
        }
    }

    function getFilteredDashboardData() {
        const query = (document.getElementById('month-records-search')?.value || '').toLowerCase().trim();
        if (!expenseData) return [];
        if (!query || query.length < 2) return expenseData;
        let filtered = expenseData.filter(row => {
            const itemText = String(row[4] || '').toLowerCase();
            return itemText.includes(query);
        });
        filtered.sort((a, b) => {
            const itemA = String(a[4] || '').toLowerCase();
            const itemB = String(b[4] || '').toLowerCase();
            return itemA.localeCompare(itemB);
        });
        return filtered;
    }

    function renderPagination(totalPages, currentPage, containerId, infoId, jsFunction) {
        const container = document.getElementById(containerId);
        if (!container) return;

        const pagFnMap = {
            'goToDashboardPage': goToDashboardPage,
            'goToReportsPage': goToReportsPage
        };
        const pagFn = pagFnMap[jsFunction] || function () { };

        container.innerHTML = '';

        const wrapper = document.createElement('div');
        wrapper.className = 'pagination-custom-container d-flex align-items-center';
        wrapper.style.cssText = 'gap: 15px; margin-right: 15px;';

        // Previous button
        const prevBtn = document.createElement('button');
        prevBtn.className = 'pag-btn' + (currentPage === 1 ? ' disabled' : '');
        prevBtn.title = 'Previous Page';
        prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
        if (currentPage > 1) {
            prevBtn.addEventListener('click', function () { pagFn(currentPage - 1); });
        }
        wrapper.appendChild(prevBtn);

        // Page info
        const info = document.createElement('span');
        info.className = 'pag-info';
        info.textContent = 'Page ' + currentPage + ' / ' + totalPages;
        wrapper.appendChild(info);

        // Next button
        const nextBtn = document.createElement('button');
        nextBtn.className = 'pag-btn' + (currentPage === totalPages ? ' disabled' : '');
        nextBtn.title = 'Next Page';
        nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
        if (currentPage < totalPages) {
            nextBtn.addEventListener('click', function () { pagFn(currentPage + 1); });
        }
        wrapper.appendChild(nextBtn);

        container.appendChild(wrapper);

        const infoEl = document.getElementById(infoId);
        if (infoEl) infoEl.style.display = 'none';
    }


    // Load items list
    function loadItemsList() {
        const cacheKey = 'items_list';

        // 1. CHECK SERVER-INJECTED DATA
        if (window.SERVER_INITIAL_DATA && window.SERVER_INITIAL_DATA.itemsList) {
            const data = window.SERVER_INITIAL_DATA.itemsList;
            window.SERVER_INITIAL_DATA.itemsList = null; // Consume so future refreshes fetch fresh data
            window.expenseCache.set(cacheKey, data);
            handleItemsListData(data);
            return;
        }

        // 2. CHECK PERSISTENT CACHE
        const cachedData = window.expenseCache.get(cacheKey);
        if (cachedData) {
            handleItemsListData(cachedData);
            return;
        }

        // 3. FALLBACK TO NETWORK
        google.script.run
            .withSuccessHandler((data) => {
                window.expenseCache.set(cacheKey, data);
                handleItemsListData(data);
            })
            .withFailureHandler((error) => {
                console.error("Error loading items list:", error);
            })
            .getItemList();
    }

    function handleItemsListData(items) {
        itemsList = (items || []).map(item => {
            if (!item || typeof item !== 'string') return item;
            return getItemDisplayName(item.trim());
        });
        populateItemsDropdown();
        populateEnhancedItemFilter();
    }

    let activeItemIndex = -1;

    function populateItemsDropdown() {
        const searchInput = document.getElementById('itemSearchInput');
        if (searchInput) searchInput.value = "";
    }

    function showInitialItems() {
        if (itemsList.length > 0) {
            activeItemIndex = -1;
            renderResults(itemsList);
        }
    }

    function filterItemsDropdown() {
        const query = (document.getElementById('itemSearchInput')?.value || "").toLowerCase();
        const resultsContainer = document.getElementById('autocompleteResults');
        if (!resultsContainer) return;

        activeItemIndex = -1;

        if (query.length === 0) {
            showInitialItems();
            return;
        }

        const filtered = itemsList.filter(item =>
            item && item.toLowerCase().includes(query)
        ).sort();

        const uniqueFiltered = [...new Set(filtered)];
        renderResults(uniqueFiltered);
    }

    function getItemDisplayName(item) {
        if (!item) return '';
        var str = item.toString().trim();
        str = str.replace(/^[\s\uD800-\uDBFF\uDC00-\uDFFF\u2600-\u27BF\uFE00-\uFE0F\u200D\u2000-\u206F\u2B50\u231A-\u23FA\u25A0-\u25FF\u2B00-\u2BFF\u2190-\u21FF\u2300-\u23FF\u2900-\u297F]+/, '');
        str = str.replace(/^[^\w\s"'(+\-\u0900-\u097F]+/u, '');
        try {
            str = str.replace(/^[\p{Extended_Pictographic}\p{Emoji_Presentation}\p{Emoji}\s]+/u, '');
        } catch (e) {}
        return str.trim();
    }

    function renderResults(list) {
        const resultsContainer = document.getElementById('autocompleteResults');
        if (!resultsContainer) return;

        if (list.length === 0) {
            resultsContainer.innerHTML = '<div class="autocomplete-item text-muted">No results found</div>';
            resultsContainer.classList.remove('d-none');
            return;
        }

        resultsContainer.innerHTML = "";
        list.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'autocomplete-item' + (index === activeItemIndex ? ' active' : '');
            div.textContent = getItemDisplayName(item);
            div.onclick = () => selectItem(item);
            resultsContainer.appendChild(div);
        });
        resultsContainer.classList.remove('d-none');
    }

    function handleItemKeyDown(e) {
        const resultsContainer = document.getElementById('autocompleteResults');
        if (!resultsContainer || resultsContainer.classList.contains('d-none')) return;

        const items = resultsContainer.getElementsByClassName('autocomplete-item');
        if (items.length === 0) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeItemIndex = (activeItemIndex + 1) % items.length;
            updateActiveItem(items);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeItemIndex = (activeItemIndex - 1 + items.length) % items.length;
            updateActiveItem(items);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeItemIndex > -1) {
                selectItem(items[activeItemIndex].textContent);
            }
        }
    }

    function updateActiveItem(items) {
        for (let i = 0; i < items.length; i++) {
            items[i].classList.toggle('active', i === activeItemIndex);
        }
        if (activeItemIndex > -1) {
            items[activeItemIndex].scrollIntoView({ block: 'nearest' });
        }
    }

    /**
     * Returns the best matching icon string for a given item name,
     * or an empty string if no match found.
     */
    function getIconForItem(name) {
        if (!name) return '';
        const lower = name.toLowerCase().trim();
        for (const entry of ITEM_ICON_MAP) {
            if (entry.keywords.some(kw => lower.includes(kw))) {
                return entry.icon;
            }
        }
        return '';
    }

    // Enhanced Reports Functions
    function loadEnhancedReports(isBackground = false) {
        const loadingSpinner = document.getElementById('reports-loading-spinner');
        const tableBody = document.getElementById('reports-table-body');

        if (!isBackground) {
            if (loadingSpinner) loadingSpinner.classList.remove('d-none');
            if (tableBody) tableBody.innerHTML = '';
        }

        const cacheKey = 'all_data';
        const cachedData = window.expenseCache.get(cacheKey);

        const dateFilter = document.getElementById('dateFilter');
        if (dateFilter && !dateFilter.value && !isBackground) {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            dateFilter.value = `${yyyy}-${mm}-${dd}`;
        }

        if (cachedData) {
            setTimeout(() => {
                handleEnhancedReportsData(cachedData);
            }, 100);
            return;
        }

        // Try to use Google Apps Script with fallback to mock data
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler((data) => {
                    window.expenseCache.set(cacheKey, data);
                    handleEnhancedReportsData(data);
                })
                .withFailureHandler((error) => {
                    console.error("Google Apps Script error:", error);
                    if (loadingSpinner) loadingSpinner.classList.add('d-none');

                    // Use mock data as fallback
                    console.log("Falling back to mock data for reports");
                    const mockData = {
                        allExpenses: Array.from({ length: 50 }, (_, i) => [
                            `2024-${String(Math.floor(i / 30) + 1).padStart(2, '0')}-${String((i % 30) + 1).padStart(2, '0')}`, // date
                            ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'][Math.floor(i / 10) % 6], // month
                            ['Groceries', 'Fuel', 'Food', 'Transport', 'Shopping', 'Bills'][i % 6], // item
                            (Math.random() * 500 + 50).toFixed(2), // amount
                            ['Cash', 'Credit Card', 'UPI', 'Bank Transfer'][i % 4], // credit
                            '2024', // year
                            ['Admin', 'User'][i % 2], // admin
                            `ID${1000 + i}` // id
                        ])

                    handleEnhancedReportsData(mockData);
                })

        } else {
            // Google Apps Script not available, use mock data immediately
            console.log("Google Apps Script not available, using mock data for reports");

            const mockData = {

                    `2024-${String(Math.floor(i / 30) + 1).padStart(2, '0')}-${String((i % 30) + 1).padStart(2, '0')}`,

        const loadingSpinner = document.getElementById('reports-loading-spinner');
        if (loadingSpinner) loadingSpinner.classList.add('d-none');

        if (response.error) {
            showAlert("Error: " + response.error, "danger");
            return;
        }

        allExpenseData = response.allExpenses || [];
        enhancedAllData = allExpenseData.map((row) => ({
            id: row[7] || "",
            date: row[0],
            month: row[1] || "",
            year: row[5] || "",
            item: row[2] || "",
            amount: parseFloat(row[3]) || 0,
            credit: row[4] || "",
            admin: row[6] || ""
        }));

        populateYearSelector();
        populateEnhancedItemFilter();
        enhancedFilterReports();

        // Apply table header freezing after data loads
        setTimeout(freezeTableHeaders, 100);
    }

    function enhancedFilterReports() {
        const itemFilter = document.getElementById('itemFilter');
        const monthFilter = document.getElementById('monthFilter');
        const yearFilter = document.getElementById('yearFilter');
        const amountFilter = document.getElementById('amountFilter');
        const quickSearch = document.getElementById('quickSearch');
        const tableBody = document.getElementById('reports-table-body');
        const filteredTotalElement = document.getElementById('filtered-total');
        const filteredCountElement = document.getElementById('filtered-count');

        if (!tableBody || !filteredTotalElement || !filteredCountElement) return;

        const itemFilterValue = itemFilter ? itemFilter.value : '';
        const monthFilterValue = monthFilter ? monthFilter.value : '';
        const yearFilterValue = yearFilter ? yearFilter.value : '';
        const amountFilterValue = amountFilter ? amountFilter.value : '';
        const dateFilter = document.getElementById('dateFilter');
        const dateFilterValue = dateFilter ? dateFilter.value : '';
        const searchValue = quickSearch ? quickSearch.value.toLowerCase() : '';

        let filteredData = enhancedAllData;

        // Auto-clear date filter if searching (requested by user)
        if (searchValue !== "" && dateFilter && dateFilter.value !== "") {
            dateFilter.value = "";
        }

        // Logic: If Year or Month filter is active, we should ignore the specific Date filter 
        // to prevent conflicts (e.g. searching for Year 2025 while Date is set to Today 2026).
        const activeDateValue = (searchValue !== "" || yearFilterValue !== "" || monthFilterValue !== "") ? "" : dateFilterValue;

        // Apply item filter
        if (itemFilterValue !== "") {
            filteredData = filteredData.filter(item => item.item === itemFilterValue);
        }

        // Apply month filter
        if (monthFilterValue !== "") {
            filteredData = filteredData.filter(item => item.month === monthFilterValue);
        }

        // Apply year filter
        if (yearFilterValue !== "") {
            filteredData = filteredData.filter(item => item.year === yearFilterValue);
        }

        // Apply amount filter
        if (amountFilterValue !== "") {
            if (amountFilterValue === '0-500') {
                filteredData = filteredData.filter(item => item.amount <= 500);
            } else if (amountFilterValue === '501-1000') {
                filteredData = filteredData.filter(item => item.amount > 500 && item.amount <= 1000);
            } else if (amountFilterValue === '1001-5000') {
                filteredData = filteredData.filter(item => item.amount > 1000 && item.amount <= 5000);
            } else if (amountFilterValue === '5001+') {
                filteredData = filteredData.filter(item => item.amount > 5000);
            }
        }

        // Apply date filter
        if (activeDateValue !== "") {
            const [filterYear, filterMonth, filterDay] = activeDateValue.split('-').map(Number);
            const filterDateObj = new Date(filterYear, filterMonth - 1, filterDay);

            if (!isNaN(filterDateObj.getTime())) {
                const filterDateStr = filterDateObj.toDateString();
                filteredData = filteredData.filter(item => {
                    const itemDateObj = new Date(item.date);
                    return !isNaN(itemDateObj.getTime()) && itemDateObj.toDateString() === filterDateStr;
                });
            }
        }

        // Apply search filter
        if (searchValue !== "") {
            filteredData = filteredData.filter(item =>
                item.item.toLowerCase().includes(searchValue) ||
                item.month.toLowerCase().includes(searchValue) ||
                item.year.includes(searchValue) ||
                item.amount.toString().includes(searchValue)
            );
        }

        // Calculate statistics
        const totalAmount = filteredData.reduce((sum, item) => sum + (item.amount || 0), 0);
        const averageAmount = filteredData.length > 0 ? totalAmount / filteredData.length : 0;
        const maxAmount = filteredData.length > 0 ? Math.max(...filteredData.map(item => item.amount || 0)) : 0;

        // Update stats cards (animated)
        const reportsTotal = document.getElementById('reports-total');
        const reportsCount = document.getElementById('reports-count');
        const reportsAverage = document.getElementById('reports-average');
        const reportsMax = document.getElementById('reports-max');

        animateValue(reportsTotal, totalAmount, 'currency');
        animateValue(reportsCount, filteredData.length, 'integer');
        animateValue(reportsAverage, averageAmount, 'currency');
        animateValue(reportsMax, maxAmount, 'currency');

        // Calculate Grand Total (All Years 2021-2026)
        const allDataTotalAmount = enhancedAllData.reduce((sum, item) => sum + (item.amount || 0), 0);
        const reportsYearTotal = document.getElementById('reports-year-total');
        animateValue(reportsYearTotal, allDataTotalAmount, 'currency');

        // Update filter stats
        filteredTotalElement.textContent = formatCurrency(totalAmount);
        filteredCountElement.textContent = filteredData.length;

        const headerAmountTotal = document.getElementById('header-amount-total');
        if (headerAmountTotal) headerAmountTotal.textContent = formatCurrency(totalAmount);

        // Check data consistency with yearly graphs
        checkDataConsistency(filteredData);

        globalFilteredReportsData = filteredData;
        currentReportsPage = 1;
        renderReportsTable();
    }

    function renderReportsTable() {
        const tableBody = document.getElementById('reports-table-body');
        const paginationContainer = document.getElementById('reports-pagination');
        const pageInfo = document.getElementById('reports-page-info');
        if (!tableBody) return;

        let dataToRender = globalFilteredReportsData.map((item, index) => {
            return { ...item, sn: index + 1 };
        });

        if (reportsSortCol) {
            dataToRender.sort((a, b) => {
                let valA, valB;
                switch (reportsSortCol) {
                    case 'sn': valA = a.sn; valB = b.sn; break;
                    case 'id': valA = String(a.id || ''); valB = String(b.id || ''); break;
                    case 'date': valA = new Date(a.date); valB = new Date(b.date); break;
                    case 'item': valA = String(a.item || ''); valB = String(b.item || ''); break;
                    case 'amount': valA = parseFloat(a.amount) || 0; valB = parseFloat(b.amount) || 0; break;
                    case 'credit': valA = String(a.credit || ''); valB = String(b.credit || ''); break;
                    case 'admin': valA = String(a.admin || ''); valB = String(b.admin || ''); break;
                    default: return 0;
                }
                if (valA < valB) return reportsSortDir === 'asc' ? -1 : 1;
                if (valA > valB) return reportsSortDir === 'asc' ? 1 : -1;
                return 0;
            });
        }

        const totalItems = dataToRender.length;
        const isMobileR = window.innerWidth <= 768;

        if (isMobileR) {
            // Mobile: Infinite Scroll
            mobileReportsAllData = dataToRender;
            mobileReportsLoadedCount = 0;
            if (mobileReportsObserver) mobileReportsObserver.disconnect();
            tableBody.innerHTML = '';
            if (dataToRender.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" class="text-center py-4"><i class="fas fa-inbox fa-2x mb-3 text-muted"></i><p class="mb-0">No data found for the selected filters</p></td></tr>`;
                if (paginationContainer) paginationContainer.innerHTML = '';
                if (pageInfo) pageInfo.textContent = '';
            } else {
                appendReportsBatch(tableBody);
                updateNotificationBadge('reports', globalFilteredReportsData);
            }
            setTimeout(freezeTableHeaders, 50);
            return;
        }

        const totalPages = Math.ceil(totalItems / REPORTS_PER_PAGE) || 1;

        if (currentReportsPage > totalPages) currentReportsPage = totalPages;

        const startIndex = (currentReportsPage - 1) * REPORTS_PER_PAGE;
        const endIndex = startIndex + REPORTS_PER_PAGE;
        const pageData = dataToRender.slice(startIndex, endIndex);

        // Render table
        if (pageData.length === 0) {
            tableBody.innerHTML = `
<tr>
<td colspan="8" class="text-center py-4">
<i class="fas fa-inbox fa-2x mb-3 text-muted"></i>
<p class="mb-0">No data found for the selected filters</p>
</td>
</tr>
`;
            if (paginationContainer) paginationContainer.innerHTML = '';
            if (pageInfo) pageInfo.textContent = '';
        } else {
            tableBody.innerHTML = '';
            pageData.forEach((item, index) => {
                const sn = item.sn;
                const monthName = item.month || CURRENT_MONTH;
                const uniqueIdValue = item.id || item.uniqueId;

                const tr = document.createElement('tr');

                    <td data-label="S.N">${sn}</td>

                    <td data-label="Admin">${item.admin || ''}</td>
                    <td data-label="Actions" style="white-space: nowrap;"></td>

                viewBtn.onclick = () => showViewModal([
                    null,

                    item.date,
                    monthName,
                    item.item,
                    item.amount,
                    item.credit || '',
                    item.admin || ''
                ]);

                const editBtn = document.createElement('button');

    function checkDataConsistency(filteredData) {
        const consistencyElement = document.getElementById('data-consistency');
        if (!consistencyElement) return;

        // Get current year data for comparison
        const currentYear = getCurrentYear();
        const yearSelector = document.getElementById('year-selector');
        const selectedYear = yearSelector ? yearSelector.value : currentYear;

        // Calculate total from reports for selected year
        const reportsYearTotal = filteredData
            .filter(item => item.year === selectedYear)
            .reduce((sum, item) => sum + (item.amount || 0), 0);

        // Get yearly data for comparison
        const yearlyData = calculateYearlyDataFromAllData(selectedYear);
        const graphsYearTotal = yearlyData.Total || 0;

        // Check consistency (allow small differences due to rounding)
        const isConsistent = Math.abs(reportsYearTotal - graphsYearTotal) < 1;

        if (isConsistent) {
            consistencyElement.className = 'data-consistency-check data-consistent';
            consistencyElement.innerHTML = '<i class="fas fa-check-circle"></i> Data Consistent';
        } else {
            consistencyElement.className = 'data-consistency-check data-inconsistent';
            consistencyElement.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Data Inconsistent';
        }
    }

    function exportFilteredData() {
        const itemFilter = document.getElementById('itemFilter');
        const monthFilter = document.getElementById('monthFilter');
        const yearFilter = document.getElementById('yearFilter');
        const amountFilter = document.getElementById('amountFilter');
        const dateFilter = document.getElementById('dateFilter');
        const quickSearch = document.getElementById('quickSearch');

        const itemFilterValue = itemFilter ? itemFilter.value : '';
        const monthFilterValue = monthFilter ? monthFilter.value : '';
        const yearFilterValue = yearFilter ? yearFilter.value : '';
        const amountFilterValue = amountFilter ? amountFilter.value : '';
        const dateFilterValue = dateFilter ? dateFilter.value : '';
        const searchValue = quickSearch ? quickSearch.value.toLowerCase() : '';

        // Auto-clear date criteria if searching (requested by user)
        const activeDateValue = (searchValue !== "") ? "" : dateFilterValue;

        let filteredData = enhancedAllData;

        if (itemFilterValue !== "") {
            filteredData = filteredData.filter(item => item.item === itemFilterValue);
        }
        if (monthFilterValue !== "") {
            filteredData = filteredData.filter(item => item.month === monthFilterValue);
        }
        if (yearFilterValue !== "") {
            filteredData = filteredData.filter(item => item.year === yearFilterValue);
        }
        if (amountFilterValue !== "") {
            if (amountFilterValue === '0-500') {
                filteredData = filteredData.filter(item => item.amount <= 500);
            } else if (amountFilterValue === '501-1000') {
                filteredData = filteredData.filter(item => item.amount > 500 && item.amount <= 1000);
            } else if (amountFilterValue === '1001-5000') {
                filteredData = filteredData.filter(item => item.amount > 1000 && item.amount <= 5000);
            } else if (amountFilterValue === '5001+') {
                filteredData = filteredData.filter(item => item.amount > 5000);
            }
        }

        // Apply date filter
        if (activeDateValue !== "") {
            const [filterYear, filterMonth, filterDay] = activeDateValue.split('-').map(Number);
            const filterDateObj = new Date(filterYear, filterMonth - 1, filterDay);

            if (!isNaN(filterDateObj.getTime())) {
                const filterDateStr = filterDateObj.toDateString();
                filteredData = filteredData.filter(item => {
                    const itemDateObj = new Date(item.date);
                    return !isNaN(itemDateObj.getTime()) && itemDateObj.toDateString() === filterDateStr;
                });
            }
        }
        if (searchValue !== "") {
            filteredData = filteredData.filter(item =>
                item.item.toLowerCase().includes(searchValue) ||
                item.month.toLowerCase().includes(searchValue) ||
                item.year.includes(searchValue) ||
                item.amount.toString().includes(searchValue)
            );
        }

        if (filteredData.length === 0) {
            showAlert("No Data 2 Export!", "warning");
            return;
        }

        // Create CSV content
        let csvContent = "ID,Date,Month,Year,Item,Amount,Credit\n";
        filteredData.forEach(item => {
            csvContent += `${item.id},"${item.date}","${item.month}","${item.year}","${item.item}",${item.amount},"${item.credit ? 'Yes' : 'No'}"\n`;
        });

        const fileName = `Filtered_Export_${new Date().toISOString().slice(0, 10)}.csv`;
        downloadCSV(csvContent, fileName);
    }

    // Enhanced Yearly Data Functions - FIXED VERSION
    function calculateYearlyDataFromAllData(year) {
        const targetYear = year || getCurrentYear();
        const yearlyData = {};
        let yearlyTotal = 0;

        // Initialize all months to 0
        MONTHS.forEach(month => yearlyData[month] = 0);

        // Calculate from enhanced data
        if (enhancedAllData && enhancedAllData.length > 0) {
            enhancedAllData.forEach(item => {
                if (item.year === targetYear && MONTHS.includes(item.month)) {
                    yearlyData[item.month] += item.amount || 0;
                    yearlyTotal += item.amount || 0;
                }
            });
        }

        // Format all amounts to 2 decimal places
        MONTHS.forEach(month => {
            yearlyData[month] = parseFloat(yearlyData[month].toFixed(2));
        });

        yearlyData["Total"] = parseFloat(yearlyTotal.toFixed(2));
        yearlyData["Year"] = targetYear;

        return yearlyData;
    }

    // Entry CRUD operations
    function populateModalWithData(rowData) {
        if (!rowData) return;
        try {
            // Parse the exact date from the sheet to display it correctly in the modal
            let formattedDate = "";
            const dateStr = rowData[2] ? String(rowData[2]).trim() : "";

            if (dateStr) {
                let parsedDate = null;

                // First check if it's strictly DD-MM-YYYY to avoid US date parsing mixup (e.g. 10-05-2026 being parsed as Oct 5)
                if (dateStr.match(/^\d{2}-\d{2}-\d{4}$/)) {
                    const parts = dateStr.split('-');
                    formattedDate = `${parts[2]}-${parts[1]}-${parts[0]}`;
                } else {
                    const dateObj = new Date(dateStr);
                    if (!isNaN(dateObj.getTime())) {
                        let year = dateObj.getFullYear();

                        const month = (dateObj.getMonth() + 1).toString().padStart(2, '0');
                        const day = dateObj.getDate().toString().padStart(2, '0');

                        // Format as YYYY-MM-DD for the HTML5 date input
                        formattedDate = `${year.toString().padStart(4, '0')}-${month}-${day}`;
                    } else {
                        // Fallback for formats JS Date might not understand natively
                        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                        const dateParts = dateStr.replace(/,/g, '').split(/[ \-\/]/);

                        if (dateParts.length >= 3) {
                            let year = 2026;
                            let month = "01";
                            let day = "01";

                            for (let part of dateParts) {
                                if (part.length === 4 && !isNaN(part)) year = part;
                                else if (monthNames.includes(part)) month = (monthNames.indexOf(part) + 1).toString().padStart(2, '0');
                                else if (!isNaN(part) && part.length <= 2) {
                                    if (!monthNames.some(m => dateParts.includes(m)) && month === "01" && parseInt(part) <= 12) month = part.padStart(2, '0');
                                    else day = part.padStart(2, '0');
                                }
                            }
                            formattedDate = `${year}-${month}-${day}`;
                        }
                    }
                }
            }

            const editUniqueId = document.getElementById('editUniqueId');
            const editMonth = document.getElementById('editMonth');
            const itemList = document.getElementById('itemList');
            const amount = document.getElementById('amount');
            const date = document.getElementById('date');
            const credit = document.getElementById('credit');
            const modalTitle = document.getElementById('modalTitle');

            if (editUniqueId) editUniqueId.value = rowData[1];
            if (editMonth) editMonth.value = rowData[3] || CURRENT_MONTH;
            if (itemList) itemList.value = getItemDisplayName(rowData[4]);
            if (amount) amount.value = isNaN(parseFloat(rowData[5])) ? '' : parseFloat(rowData[5]);
            if (date) date.value = formattedDate;
            if (credit) credit.value = rowData[6] || "";

            if (modalTitle) modalTitle.innerHTML = '<i class="fas fa-edit me-2"></i>Edit Expense Entry';
        } catch (e) {
            console.error("Error populating modal data:", e);
            showAlert("Error preparing data for edit.", "danger");
        }
    }

        console.log("Attempting to save entry...");
        const uniqueId = document.getElementById('editUniqueId');
        const month = document.getElementById('editMonth');

        const amount = document.getElementById('amount');

        if (!uniqueId || !month || !itemList || !amount || !date || !credit) {

        }

        const uniqueIdValue = uniqueId.value;
        const monthValue = month.value || CURRENT_MONTH;
        const itemListValue = getItemDisplayName(itemList.value).trim();
        const amountValue = parseFloat(amount.value);
        const dateValue = date.value;
        const creditValue = credit.value;

        let entryUser = currentUser ? currentUser.name : 'Unknown';
        if (entryUser.toLowerCase() === 'admin') {
            entryUser = 'Anil Chahar';
        } else if (entryUser.toLowerCase() === 'user') {
            entryUser = 'Radhika Chahar';
        }

        const entryData = {
            uniqueId: uniqueIdValue,
            month: monthValue,
            itemList: itemListValue,
            amount: amountValue,
            date: dateValue,
            credit: creditValue,
            user: entryUser
        };

        console.log("Sending entry data:", entryData);

        // Show saving state
        const saveBtn = document.querySelector('#entryModal .btn-primary');
        const originalBtnText = saveBtn ? saveBtn.innerHTML : 'Save Record';
        if (saveBtn) {
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Saving...';
            saveBtn.disabled = true;
        }

        // ── Optimistic Update: immediately reflect in UI ───────────────────────
        const isNewEntry = !uniqueIdValue;
        if (isNewEntry && window.expenseCache) {
            const cachedAll = window.expenseCache.get('all_data');
            if (cachedAll && cachedAll.allExpenses) {
                // Build a row in the same format as backend: [date, month, item, amount, credit, year, admin, uid]
                const optDate = `${monthValue} ${new Date(dateValue).getDate() || dateValue} ${new Date(dateValue).getFullYear() || CURRENT_YEAR}`;
                const optimisticRow = [optDate, monthValue, itemListValue, amountValue, creditValue, CURRENT_YEAR, entryUser, 'pending'];
                cachedAll.allExpenses.unshift(optimisticRow);
                window.expenseCache.set('all_data', cachedAll);
                autoRefreshData(); // Reflect immediately in UI
            }
        }
        // ─────────────────────────────────────────────────────────────────────

        google.script.run
            .withSuccessHandler((response) => {
                console.log("Save response received:", response);

                if (saveBtn) {
                    saveBtn.innerHTML = originalBtnText;
                    saveBtn.disabled = false;
                }

                if (response.success) {
                    const isEdit = !!uniqueIdValue;
                    showAlert(`Entry ${isEdit ? 'Updated' : 'Created'} Successfully!`);

                    // ── Push a notification for the last updated or added item ────────────────
                    pushExpenseNotification({
                        action: isEdit ? 'updated' : 'added',
                        item: itemListValue,
                        amount: amountValue,
                        date: dateValue,
                        credit: creditValue,
                        month: monthValue
                    });
                    // ──────────────────────────────────────────────────────

                    const modalElement = document.getElementById('entryModal');
                    if (modalElement) {
                        const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
                        modal.hide();
                    }

                    // ── Targeted cache invalidation (faster than invalidateAll) ──
                    if (window.expenseCache) {
                        window.expenseCache.invalidate(`monthly_${monthValue}`);
                        window.expenseCache.invalidate('all_data');
                        // If month changed during edit, also clear old month cache
                        if (isEdit && monthValue !== CURRENT_MONTH) {
                            window.expenseCache.invalidate(`monthly_${CURRENT_MONTH}`);
                        }
                    }

                    // Re-fetch only the affected month directly (fastest possible refresh)
                    const activePage = document.querySelector('.page-content:not(.d-none)');
                    const pageId = activePage ? activePage.id.replace('-page', '') : '';
                    if (pageId === 'dashboard') {
                        loadMonth(monthValue, true, true); // forceRefresh = true: skip cache, go straight to sheet
                    } else {
                        autoRefreshData();
                    }
                } else {
                    // ── Rollback: remove optimistic entry on failure ────────
                    if (isNewEntry && window.expenseCache) {
                        window.expenseCache.invalidate('all_data');
                    }
                    showAlert("Error: " + (response.error || "Unknown Error"), "Danger");
                }
            })
            .withFailureHandler((err) => {
                console.error("Save failure:", err);
                if (saveBtn) {
                    saveBtn.innerHTML = originalBtnText;
                    saveBtn.disabled = false;
                }
                // Rollback optimistic update on network/server failure
                if (isNewEntry && window.expenseCache) {
                    window.expenseCache.invalidate('all_data');
                    autoRefreshData();
                }
                handleError(err);
            })
            .addEntry(entryData);
    }

    function downloadExcelBase64(base64Data, fileName) {
        try {
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 200);
        } catch (e) {
            console.error("Base64 Excel download failed:", e);
            showAlert("Export download failed: " + e.message, "danger");
        }
    }

    function downloadCSV(csvContent, fileName) {
        try {
            // Primary: Blob URL (works in most browsers + modern WebViews)
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 200);
        } catch (e) {
            // Fallback: data URI (works in restricted WebViews)
            const encoded = encodeURIComponent(csvContent);
            const dataUri = 'data:text/csv;charset=utf-8,' + encoded;
            const a = document.createElement('a');
            a.href = dataUri;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }

    let pdfPreviewModalInstance = null;

    function downloadMonthReport(monthName) {
        const month = monthName || CURRENT_MONTH;
        const year = CURRENT_YEAR;
        const reportData = getReportHTMLContent(month, year);

        const modalEl = document.getElementById('pdfPreviewModal');
        const iframe = document.getElementById('pdfPreviewIframe');
        const badgeEl = document.getElementById('pdfPreviewMonthBadge');

        if (badgeEl) {
            badgeEl.textContent = `${month} ${year}`;
        }

        if (modalEl && iframe) {
            // Write the generated HTML into the iframe
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(reportData.html);
            doc.close();

            // Show the modal
            pdfPreviewModalInstance = bootstrap.Modal.getOrCreateInstance(modalEl);
            pdfPreviewModalInstance.show();
        } else {
            // Fallback: If elements are missing, open in a new tab
            const newWin = window.open('', '_blank');
            if (newWin) {
                newWin.document.open();
                newWin.document.write(reportData.html);
                newWin.document.close();
            } else {
                // Fallback 2: data URI
                const encoded = encodeURIComponent(reportData.html);
                window.location.href = 'data:text/html;charset=utf-8,' + encoded;
            }
        }
    }

    function printPreviewPDF() {
        const iframe = document.getElementById('pdfPreviewIframe');
        if (iframe && iframe.contentWindow) {
            try {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
            } catch (e) {
                console.warn("Direct iframe print failed, trying print fallback:", e);
                try {
                    const htmlContent = iframe.contentDocument ? iframe.contentDocument.documentElement.outerHTML : '';
                    if (htmlContent) {
                        const blob = new Blob([htmlContent], { type: 'text/html' });
                        const blobUrl = URL.createObjectURL(blob);
                        const win = window.open(blobUrl, '_blank');
                        if (win) {
                            win.onload = () => {
                                win.focus();
                                win.print();
                            };
                        } else {
                            window.location.href = blobUrl;
                        }
                    }
                } catch (err) {
                    console.error("Print fallback failed:", err);
                    alert("Print failed: " + e.message);
                }
            }
        }
    }
    window.printPreviewPDF = printPreviewPDF;

        const fileName = `Expense_Report_${month}_${year}`;

    function showTrashModal() {
        const modalEl = document.getElementById('trashModal');

    function renderTrashTable(rows) {
        document.getElementById('trash-loading').style.display = 'none';

        if (!rows || rows.length === 0) {
            document.getElementById('trash-empty').style.display = 'block';
            document.getElementById('trash-table').style.display = 'none';
            return;
        }

        document.getElementById('trash-empty').style.display = 'none';
        document.getElementById('trash-table').style.display = 'table';

        const tbody = document.getElementById('trash-table-body');
        tbody.innerHTML = '';

        rows.forEach(row => {
            const emoji = (typeof getIconForItem === 'function' ? getIconForItem(row.item) : '').split(' ')[0] || '💰';
            const deletedAt = row.deletedAt ? new Date(row.deletedAt).toLocaleDateString('en-IN') : '-';
            const dateStr = row.date ? (() => {
                try { const d = new Date(row.date); return isNaN(d) ? row.date : `${d.getDate()} ${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()]} ${d.getFullYear()}`; } catch { return row.date; }
            })() : '-';

            const tr = document.createElement('tr');
            tr.style.cssText = 'border-bottom:1px solid #fde8e8; transition: background 0.2s;';
            tr.onmouseenter = () => tr.style.background = '#fff5f5';
            tr.onmouseleave = () => tr.style.background = '';
            tr.innerHTML = `
                <td style="padding:9px 12px; font-weight:700;">
                    <span style="margin-right:6px;">${emoji}</span>${row.item || '-'}
                </td>
                <td style="padding:9px 6px; color:#6b7280;">${dateStr}</td>
                <td style="padding:9px 6px;">
                    <span style="background:#fde8e8;color:#991b1b;border-radius:4px;padding:1px 6px;font-size:0.7rem;font-weight:700;">${row.origMonth || row.month || '-'}</span>
                </td>
                <td style="padding:9px 6px; font-weight:800; color:#1e3a8a;">${formatCurrency(row.amount)}</td>
                <td style="padding:9px 6px; color:#6b7280; font-style:italic; font-size:0.75rem;">${row.credit || '-'}</td>
                <td style="padding:9px 6px; color:#6b7280;">${row.deletedBy || '-'}</td>
                <td style="padding:9px 6px; color:#9ca3af; font-size:0.72rem;">${deletedAt}</td>
                <td style="padding:9px 6px; text-align:center;">
                    <button class="btn btn-sm" onclick="restoreEntryFromTrash('${row.uniqueId}', this)"
                        style="background:linear-gradient(135deg,#10b981,#059669);color:white;border:none;border-radius:6px;padding:3px 10px;font-size:0.72rem;font-weight:700;">
                        <i class="fas fa-undo me-1"></i>Restore
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function restoreEntryFromTrash(uniqueId, btn) {
        if (!uniqueId) return;
        const originalHTML = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;

        google.script.run
            .withSuccessHandler((response) => {
                if (response && response.success) {
                    // Remove the row from the table
                    const tr = btn.closest('tr');
                    if (tr) {
                        tr.style.transition = 'opacity 0.4s, transform 0.4s';
                        tr.style.opacity = '0';
                        tr.style.transform = 'translateX(40px)';
                        setTimeout(() => {
                            tr.remove();
                            // Check if table is empty now
                            const tbody = document.getElementById('trash-table-body');
                            if (tbody && tbody.children.length === 0) {
                                document.getElementById('trash-table').style.display = 'none';
                                document.getElementById('trash-empty').style.display = 'block';
                            }
                        }, 400);
                    }
                    showAlert(`✅ Entry restored to ${response.month || 'original month'} successfully!`, 'success');
                    if (window.expenseCache) window.expenseCache.invalidateAll();
                    autoRefreshData();
                } else {
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                    showAlert('Error: ' + (response ? response.error : 'Restore failed'), 'danger');
                }
            })
            .withFailureHandler((err) => {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                handleError(err);
            })
            .restoreEntry(uniqueId);
    }

    function saveNewItem() {
        const itemNameInput = document.getElementById('newItemName');
        const categoryInput = document.getElementById('itemCategory');
        const addToDropdownInput = document.getElementById('addToDropdown');

        if (!itemNameInput) return;

        const itemName = itemNameInput.value.trim();
        const category = categoryInput ? categoryInput.value : '';
        const addToDropdown = addToDropdownInput ? addToDropdownInput.checked : true;

        if (!itemName) {
            showAlert("Please enter an item name!", "warning");
            itemNameInput.focus();
            return;
        }

        // Check if item already exists in the list
        if (itemsList.includes(itemName)) {
            showAlert(`Item "${itemName}" already exists in the list!`, "warning");
            return;
        }

        // Show loading state
        const saveBtn = document.querySelector('#addItemModal .btn-success');
        if (saveBtn) {
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Saving...';
            saveBtn.disabled = true;
        }

        // Call Google Apps Script function to add item
        google.script.run
            .withSuccessHandler(function (response) {
                if (response.success) {
                    // Add to local items list
                    itemsList.push(itemName);
                    itemsList.sort();

                    // Update dropdowns if requested
                    if (addToDropdown) {
                        updateItemDropdowns(itemName);
                    }

                    // Clear form and close modal
                    if (itemNameInput) itemNameInput.value = '';
                    if (categoryInput) categoryInput.value = '';
                    if (addToDropdownInput) addToDropdownInput.checked = true;

                    const modalElement = document.getElementById('addItemModal');
                    if (modalElement) {
                        const modal = bootstrap.Modal.getInstance(modalElement);
                        if (modal) modal.hide();
                    }

                    showAlert(response.message || `Item "${itemName}" added successfully!`, "success");

                    pushItemNotification({
                        action: 'added',
                        item: itemName,
                        category: categoryInput ? categoryInput.value : ''
                    });

                    // Refresh items list in cache
                    if (window.expenseCache) {
                        window.expenseCache.invalidate('items_list');
                    }

                } else {
                    showAlert("Error: " + (response.error || "Failed to add item"), "danger");
                }

                // Restore button state
                if (saveBtn) {
                    saveBtn.innerHTML = '<i class="fas fa-save me-1"></i>Save Item';
                    saveBtn.disabled = false;
                }
            })
            .withFailureHandler(function (error) {
                showAlert("Error adding item: " + error.message, "danger");
                console.error("Error adding item:", error);

                // Restore button state
                const saveBtn = document.querySelector('#addItemModal .btn-success');
                if (saveBtn) {
                    saveBtn.innerHTML = '<i class="fas fa-save me-1"></i>Save Item';
                    saveBtn.disabled = false;

            for (let i = 0; i < itemDropdown.options.length; i++) {

                    const option = document.createElement('option');
                    option.value = newItem;

                    itemDropdown.add(option, i);

            }

            if (!added) {
                const option = document.createElement('option');
                option.value = newItem;
                option.textContent = newItem;
                itemDropdown.appendChild(option);

        // Function to wrap a single table
        function wrapTable(table) {
            if (!table || table.classList.contains('header-frozen')) return;

            // Check if table has a header
            if (!table.querySelector('thead')) {
                console.warn('Table has no thead element');
                return;
            }

            // Create wrapper div
            const wrapper = document.createElement('div');
            wrapper.className = 'table-scroll-container';

            // Wrap the table
            const parent = table.parentNode;

            // Check if already wrapped
            if (parent.classList.contains('table-scroll-container')) {
                return;
            }

            parent.replaceChild(wrapper, table);
            wrapper.appendChild(table);

            // Mark as processed
            table.classList.add('header-frozen');

            // Adjust column widths to prevent header misalignment
            setTimeout(() => {
                const headerCells = table.querySelectorAll('thead th');
                const bodyCells = table.querySelectorAll('tbody tr:first-child td');

                if (headerCells.length === bodyCells.length) {
                    headerCells.forEach((headerCell, index) => {
                        if (bodyCells[index]) {
                            const cellWidth = Math.max(
                                headerCell.offsetWidth,
                                bodyCells[index].offsetWidth
                            );
                            headerCell.style.minWidth = cellWidth + 'px';
                            if (bodyCells[index]) {
                                bodyCells[index].style.minWidth = cellWidth + 'px';
                            }
                        }
                    });
                }

                // Ensure table takes full width
                table.style.width = '100%';
                table.style.tableLayout = 'auto';
            }, 100);
        }

        // Function to wrap all tables
        function wrapAllTables() {
            const tableContainers = document.querySelectorAll('.table-container, .table-responsive');

            tableContainers.forEach(container => {
                const table = container.querySelector('table');
                if (table && !table.classList.contains('header-frozen')) {
                    wrapTable(table);
                }
            });

            // Also check for tables directly in page content
            const pageContents = document.querySelectorAll('.page-content');
            pageContents.forEach(content => {
                const tables = content.querySelectorAll('table:not(.header-frozen)');
                tables.forEach(table => {
                    if (table.querySelector('thead')) {
                        // Create a container if needed
                        if (!table.parentNode.classList.contains('table-container') &&
                            !table.parentNode.classList.contains('table-responsive')) {
                            const container = document.createElement('div');
                            container.className = 'table-responsive';
                            table.parentNode.insertBefore(container, table);
                            container.appendChild(table);
                        }
                        wrapTable(table);
                    }
                });
            });
        }

        // Initialize
        setTimeout(wrapAllTables, 300);

        // Re-apply when content changes (for dynamic tables)
        const observer = new MutationObserver(() => {
            setTimeout(wrapAllTables, 100);
        });

        observer.observe(document.body, {
            childList: true,
            subtree: true
        });

        // Return function for manual triggering
        return wrapAllTables;
    }

        // Update monthly comparison
        if (data.monthlyComparison) renderMonthlyComparison(data.monthlyComparison);

        showAlert("Summary data loaded successfully!", "success");
