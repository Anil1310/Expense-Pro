    function handleCategoryExpensesData(response) {
        const loadingDiv = document.getElementById('categories-loading');
        if (loadingDiv) loadingDiv.remove();

        if (response.error) {
            showAlert("Error: " + response.error, "danger");
            return;
        }

        const data = response.allExpenses || [];
        const categorySums = {};
        let grandTotal = 0;

        const monthFilter = document.getElementById('cat-month-filter') ? document.getElementById('cat-month-filter').value : 'all';
        const yearFilter = document.getElementById('cat-year-filter') ? document.getElementById('cat-year-filter').value : 'all';

        data.forEach(row => {
            const month = String(row[1] || "").trim();
            const category = String(row[2] || "Uncategorized").trim();
            const amount = parseFloat(row[3]) || 0;
            const year = String(row[5] || "").trim();

            let includeRow = true;
            if (monthFilter !== 'all' && month !== monthFilter) includeRow = false;
            if (yearFilter !== 'all' && year !== yearFilter) includeRow = false;

            if (includeRow && category) {
                if (!categorySums[category]) categorySums[category] = 0;
                categorySums[category] += amount;
                grandTotal += amount;
            }
        });

        // Sort descending
        const sortedCategories = Object.keys(categorySums).sort((a, b) => categorySums[b] - categorySums[a]);

        // Populate KPI Cards
        const kpiTotal = document.getElementById('cat-kpi-total');
        const kpiHighest = document.getElementById('cat-kpi-highest');
        const kpiSpending = document.getElementById('cat-kpi-spending');
        const kpiAvg = document.getElementById('cat-kpi-avg');

        if (kpiTotal) kpiTotal.textContent = sortedCategories.length;
        if (kpiHighest && sortedCategories.length > 0) {
            const topCat = sortedCategories[0];
            kpiHighest.textContent = topCat;
            kpiHighest.title = `${topCat}: ${categorySums[topCat].toLocaleString('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 })}`;
        }
        if (kpiSpending) kpiSpending.textContent = grandTotal.toLocaleString('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
        if (kpiAvg && sortedCategories.length > 0) {
            const avgVal = grandTotal / sortedCategories.length;
            kpiAvg.textContent = avgVal.toLocaleString('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
        }

        // Render Category Chart
        try {
            if (window.categoryDistChartInstance) {
                window.categoryDistChartInstance.destroy();
            }

            const top5Cats = sortedCategories.slice(0, 5);
            const top5Sums = top5Cats.map(cat => categorySums[cat]);

            let otherSum = 0;
            sortedCategories.slice(5).forEach(cat => {
                otherSum += categorySums[cat];
            });

            const labels = [...top5Cats];
            const dataVals = [...top5Sums];
            if (otherSum > 0) {
                labels.push('Others');
                dataVals.push(otherSum);
            }

            const ctx = document.getElementById('categoryDistributionChart');
            if (ctx) {
                const ctx2d = ctx.getContext('2d');
                window.categoryDistChartInstance = new Chart(ctx2d, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: dataVals,
                            backgroundColor: [
                                '#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#64748b'
                            ],
                            borderWidth: 1,
                            borderColor: 'rgba(255, 255, 255, 0.1)'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: {
                                    color: 'rgba(255, 255, 255, 0.7)',
                                    font: { size: 10 }
                                }
                            }
                        }
                    }
                });
            }
        } catch (e) {
            console.error("Failed to render category distribution chart:", e);
        }

        const tableBody = document.getElementById('category-ranking-body');
        if (!tableBody) return;

        let rowsHtml = '';
        sortedCategories.forEach((cat, index) => {
            const amt = categorySums[cat];
            const pct = grandTotal > 0 ? ((amt / grandTotal) * 100).toFixed(1) : 0;

            // Escaping quotes for cat name
            const escapedCatName = String(cat).replace(/'/g, "\\'");

            let rankStyle = 'color: #94a3b8;';
            let rankText = `${index + 1}`;
            if (index === 0) {
                rankStyle = 'color: #facc15; font-weight: 800;';
                rankText = `<i class="fas fa-crown me-1" style="color: #facc15;"></i> 1`;
            } else if (index === 1) {
                rankStyle = 'color: #cbd5e1; font-weight: 800;';
            } else if (index === 2) {
                rankStyle = 'color: #d97706; font-weight: 800;';
            }

            rowsHtml += `
                <tr onclick="viewCategoryDetails('${escapedCatName}')" style="cursor: pointer;" class="category-row">
                    <td style="font-size: 0.85rem; ${rankStyle}">${rankText}</td>
                    <td style="font-size: 0.85rem; font-weight: 600; color: #fff;">${cat}</td>
                    <td>
                        <div class="progress-premium">
                            <div class="progress-bar-premium" role="progressbar" style="width: ${pct}%;" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
                                ${pct}%
                            </div>
                        </div>
                    </td>
                    <td style="text-align: right; font-size: 0.85rem; font-weight: bold; color: var(--accent-color);">${amt.toLocaleString('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 })}</td>
                </tr>
            `;
        });

        tableBody.innerHTML = rowsHtml || '<tr><td colspan="4" class="text-center">No category data found</td></tr>';

        // Automatically click first category if present to show more records immediately
        if (sortedCategories.length > 0) {
            viewCategoryDetails(sortedCategories[0]);
        }
    }

    function viewCategoryDetails(catName) {
        // Highlight correct selected category row
        document.querySelectorAll('#category-ranking-body .category-row').forEach(row => {
            row.classList.remove('selected-active');
            const rowCatName = row.children[1] ? row.children[1].textContent.trim() : '';
            if (rowCatName === String(catName).trim()) {
                row.classList.add('selected-active');
            }
        });

        const cacheKey = 'all_data';
        const cachedData = window.expenseCache.get(cacheKey);
        if (!cachedData) return;

        const data = cachedData.allExpenses || [];
        const monthFilter = document.getElementById('cat-month-filter') ? document.getElementById('cat-month-filter').value : 'all';
        const yearFilter = document.getElementById('cat-year-filter') ? document.getElementById('cat-year-filter').value : 'all';

        const filteredRecords = data.filter(row => {
            if (String(row[2] || "").trim() !== String(catName).trim()) return false;

            const month = String(row[1] || "").trim();
            const year = String(row[5] || "").trim();

            if (monthFilter !== 'all' && month !== monthFilter) return false;
            if (yearFilter !== 'all' && year !== yearFilter) return false;

            return true;
        });

        // Sort by date descending
        filteredRecords.sort((a, b) => new Date(b[0]) - new Date(a[0]));

        const titleElem = document.getElementById('category-details-title');
        if (titleElem) {
            titleElem.innerHTML = `<i class="fas fa-list me-2 text-info"></i>${catName} Records (${filteredRecords.length})`;
        }

        const tableBody = document.getElementById('category-details-body');
        if (!tableBody) return;

        let rowsHtml = '';
        filteredRecords.forEach(row => {
            const rawDate = row[0] || '';
            const date = formatDisplayDate(rawDate) || 'N/A';
            const remark = row[4] || row[2] || '—';
            const amount = parseFloat(row[3]) || 0;

            rowsHtml += `
                <tr class="category-detail-row">
                    <td style="font-size: 0.825rem; color: #fff; font-weight: 500;">${date}</td>
                    <td style="font-size: 0.825rem; color: rgba(255, 255, 255, 0.7); font-weight: 400;">${remark}</td>
                    <td style="text-align: right; font-size: 0.85rem; font-weight: 700; color: var(--accent-color);">${amount.toLocaleString('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 })}</td>
                </tr>
            `;
        });

        tableBody.innerHTML = rowsHtml || '<tr><td colspan="3" class="text-center">No records found</td></tr>';
    }

    function loadYearlyChart(isBackground = false) {
        const cacheKey = 'all_data';
        const cachedData = window.expenseCache.get(cacheKey);

        if (cachedData) {
            handleYearlyChartData(cachedData);
            return;
        }

        // Show loading indicator
        const page = document.getElementById('yearly-chart-page');
        if (page && !document.getElementById('yearly-chart-loading') && !isBackground) {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'spinner-container';
            loadingDiv.innerHTML = '<div class="spinner"></div>';
            loadingDiv.id = 'yearly-chart-loading';
            page.appendChild(loadingDiv);
        }

        // Try to get data from backend
        google.script.run
            .withSuccessHandler((data) => {
                window.expenseCache.set(cacheKey, data);
                handleYearlyChartData(data);
            })
            .withFailureHandler((error) => {
                console.warn("Backend error, using fallback yearly data:", error);
                // Use fallback data if backend fails
                const fallbackData = generateFallbackYearlyData();
                handleYearlyChartData(fallbackData);
            })
            .getAllData();
    }

    function handleYearlyChartData(response) {
        const loadingDiv = document.getElementById('yearly-chart-loading');
        if (loadingDiv) loadingDiv.remove();

        if (response.error) {
            showAlert("Error: " + response.error, "danger");
            return;
        }

        const data = response.allExpenses || [];

        // Group by year and month
        const yearSums = {};
        const yearMonthData = {};
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        data.forEach(row => {
            const month = String(row[1] || "");
            const year = String(row[5] || "");
            const amount = parseFloat(row[3]) || 0;

            if (year) {
                const y = parseInt(year);
                if (isNaN(y) || y < 2021) return; // Skip years older than 2021 (like 2001)

                if (!yearSums[year]) yearSums[year] = 0;
                yearSums[year] += amount;

                if (months.includes(month)) {
                    if (!yearMonthData[year]) {
                        yearMonthData[year] = { 'Jan': 0, 'Feb': 0, 'Mar': 0, 'Apr': 0, 'May': 0, 'Jun': 0, 'Jul': 0, 'Aug': 0, 'Sep': 0, 'Oct': 0, 'Nov': 0, 'Dec': 0 };
                    }
                    yearMonthData[year][month] += amount;
                }
            }
        });

        // Sort years ascending
        const sortedYears = Object.keys(yearSums).sort((a, b) => parseInt(a) - parseInt(b));
        const chartData = sortedYears.map(year => yearSums[year]);

        renderYearlyColChart(sortedYears, chartData);
        renderYearlyMonthChart(sortedYears, yearMonthData, months);

        // Render Ranking list
        const rankedYears = Object.keys(yearSums).map(y => ({ year: y, total: yearSums[y] }));
        rankedYears.sort((a, b) => b.total - a.total);

        const rankBody = document.getElementById('yearly-ranking-body');
        if (rankBody) {
            let rankHtml = '';
            let grandTotal = 0;

            rankedYears.forEach((item, index) => {
                grandTotal += item.total;

                let rankBadge = '';
                if (index === 0) rankBadge = '<span class="badge bg-warning text-dark" style="font-size:0.75rem;"><i class="fas fa-medal"></i> 1st</span>';
                else if (index === 1) rankBadge = '<span class="badge bg-secondary" style="font-size:0.75rem;"><i class="fas fa-medal"></i> 2nd</span>';
                else if (index === 2) rankBadge = '<span class="badge text-white" style="background-color: #cd7f32; font-size:0.75rem;"><i class="fas fa-medal"></i> 3rd</span>';
                else rankBadge = `<span style="font-size:0.8rem; padding-left:5px; font-weight:bold; color:#888;">${index + 1}th</span>`;

                rankHtml += `
                <tr style="height: 40px;">
                  <td style="vertical-align: middle; border-bottom: 1px solid rgba(0,0,0,0.05);">${rankBadge}</td>
                  <td style="font-weight: bold; font-size:0.85rem; vertical-align: middle; border-bottom: 1px solid rgba(0,0,0,0.05);">${item.year}</td>
                  <td style="text-align: right; color: #4CAF50; font-weight: bold; font-size:0.85rem; vertical-align: middle; border-bottom: 1px solid rgba(0,0,0,0.05);">₹${item.total.toLocaleString('en-IN', { maximumFractionDigits: 0 })}</td>
                </tr>`;
            });

            // Grand Total Row
            rankHtml += `
            <tr style="height: 40px; background-color: rgba(76, 175, 80, 0.1);">
              <td colspan="2" style="font-weight: 800; font-size:0.95rem; vertical-align: middle; text-align: right; color: var(--text-color);">Grand Total:</td>
              <td style="text-align: right; color: #4CAF50; font-weight: 900; font-size:1.05rem; vertical-align: middle;">₹${grandTotal.toLocaleString('en-IN', { maximumFractionDigits: 0 })}</td>
            </tr>`;

            rankBody.innerHTML = rankHtml;
        }
    }

    function renderYearlyColChart(labels, data) {
        const isDarkMode = document.body.getAttribute('data-theme') === 'dark';
        const textColor = isDarkMode ? '#ffd700' : '#666';
        const gridColor = isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0,0,0,0.1)';

        const ctx = document.getElementById('yearlyColChart').getContext('2d');

        if (yearlyColChartInstance) {
            yearlyColChartInstance.destroy();
        }

        // Create a vibrant gradient
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(52, 168, 83, 0.8)');
        gradient.addColorStop(1, 'rgba(52, 168, 83, 0.2)');

        yearlyColChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Total Expenses (₹)',
                    data: data,
                    backgroundColor: gradient,
                    borderColor: 'rgba(52, 168, 83, 1)',
                    borderWidth: 2,
                    borderRadius: 6,
                    hoverBackgroundColor: 'rgba(52, 168, 83, 1)',
                    barThickness: 'flex'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                return '₹' + context.raw.toLocaleString('en-IN', { maximumFractionDigits: 0 });
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: gridColor },
                        ticks: {
                            color: textColor,
                            callback: function (value) {
                                return '₹' + (value >= 1000 ? (value / 1000) + 'k' : value);
                            }
                        }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: textColor, font: { weight: 'bold', size: 14 } }
                    }
                }
            }
        });
    }

    let yearlyMonthChartInstance = null;

    function renderYearlyMonthChart(sortedYears, yearMonthData, months) {
        const isDarkMode = document.body.getAttribute('data-theme') === 'dark';
        const textColor = isDarkMode ? '#ffd700' : '#666';
        const gridColor = isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0,0,0,0.1)';

        const ctx = document.getElementById('yearlyMonthChart').getContext('2d');

        if (yearlyMonthChartInstance) {
            yearlyMonthChartInstance.destroy();
        }

        const colors = [
            '#4285F4', // Blue
            '#0F9D58', // Green
            '#DB4437', // Red
            '#F4B400', // Yellow
            '#AA46BE', // Purple
            '#00ACC1', // Cyan
            '#FF7043', // Deep Orange
            '#3F51B5'  // Indigo
        ];

        const datasets = sortedYears.map((year, index) => {
            const dataPts = months.map(m => yearMonthData[year] ? yearMonthData[year][m] : 0);
            return {
                label: year,
                data: dataPts,
                borderColor: colors[index % colors.length],
                backgroundColor: colors[index % colors.length],
                borderWidth: 2,
                pointRadius: 4,
                pointHoverRadius: 6,
                fill: false,
                tension: 0.3 // smooth curves
            };
        });

        yearlyMonthChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: months,
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: {
                        display: true,
                        labels: { color: textColor }
                    },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                return context.dataset.label + ': ₹' + context.raw.toLocaleString('en-IN', { maximumFractionDigits: 0 });
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: gridColor },
                        ticks: {
                            color: textColor,
                            callback: function (value) {
                                return '₹' + (value >= 1000 ? (value / 1000) + 'k' : value);
                            }
                        }
                    },
                    x: {
                        grid: { color: gridColor },
                        ticks: { color: textColor, font: { weight: 'bold' } }
                    }
                }
            }
        });
    }

    function handleGraphsData(data, type, year, user) {
        console.log('Graphs Data Received:', { type, year, user, data });

        // Remove loading indicator
        const loadingDiv = document.getElementById('graphs-loading');
        if (loadingDiv) loadingDiv.remove();

        // Update main chart
        if (data && data.mainChart) {
            renderMainChart(data.mainChart, type);
        } else {
            console.warn('No mainChart data, generating fallback');
            const fallbackData = generateFallbackGraphData(type, year, user);
            renderMainChart(fallbackData.mainChart, type);
        }

        // Update pie chart
        if (data && data.pieChart) {
            renderPieChart(data.pieChart);
        } else {
            const fallbackData = generateFallbackGraphData(type, year, user);
            renderPieChart(fallbackData.pieChart);
        }

        // Update bar chart
        if (data && data.barChart) {
            renderBarChart(data.barChart);
        } else {
            const fallbackData = generateFallbackGraphData(type, year, user);
            renderBarChart(fallbackData.barChart);
        }

        // Update detailed chart
        if (data && data.detailedChart) {
            renderDetailedChart(data.detailedChart);
        } else {
            const fallbackData = generateFallbackGraphData(type, year, user);
            renderDetailedChart(fallbackData.detailedChart);
        }

        showAlert("Graphs Updated Successfully!", "success");
    }

    (function wrapGSR() {
        const originalRun = google.script.run;
        const proxy = new Proxy(originalRun, {
            get(target, prop) {
                if (typeof target[prop] === 'function') {
                    return function (...args) {
                        Progress.start();
                        const result = target[prop](...args);
                        // We wrap the returned object to catch success/failure
                        return {
                            withSuccessHandler: function (sh) {
                                return result.withSuccessHandler((...shArgs) => {
                                    Progress.done();
                                    sh(...shArgs);
                                });
                            },
                            withFailureHandler: function (fh) {
                                return result.withFailureHandler((...fhArgs) => {
                                    Progress.done();
                                    fh(...fhArgs);
                                });
                            }
                        };
                    };
                }
                return target[prop];
            }
        });
        // Note: Replacing the global proxy might be complex due to how GSR works, 
        // so we'll manually add Progress.start/done to key functions instead for stability.
    })();

    // --- Profile Photo Logic ---
    function handleAvatarSelection(event) {
        const file = event.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            showAlert('Please select an image file', 'warning');
            return;
        }

        const reader = new FileReader();
        reader.onload = function (e) {
            const img = new Image();
            img.onload = function () {
                // Resize to 100x100 and compress
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 100;
                canvas.height = 100;

                // Center crop
                const size = Math.min(img.width, img.height);
                const x = (img.width - size) / 2;
                const y = (img.height - size) / 2;

                ctx.drawImage(img, x, y, size, size, 0, 0, 100, 100);

                // Highly compress to fit inside PropertiesService (9KB limit per value)
                const base64Data = canvas.toDataURL('image/jpeg', 0.6);

                // Optimistically update UI
                updateAvatarUI(base64Data);

                // Send to backend
                if (typeof google !== 'undefined' && google.script && currentUser) {
                    google.script.run
                        .withSuccessHandler(function (res) {
                            if (res && res.success) {
                                showAlert('Profile photo updated!', 'success');
                            } else {
                                showAlert('Failed to save photo. ' + (res.error || 'Too large.'), 'danger');
                            }
                        })
                        .saveProfilePhoto(currentUser.username, base64Data);
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function updateAvatarUI(base64Data) {
        const icons = document.querySelectorAll('.default-avatar-icon');
        const imgs = document.querySelectorAll('.user-avatar-img');

        if (base64Data && base64Data.length > 10) {
            imgs.forEach(img => {
                img.src = base64Data;
                img.style.display = 'block';
            });
            icons.forEach(icon => icon.style.display = 'none');
        } else {
            imgs.forEach(img => {
                img.style.display = 'none';
                img.src = '';
            });
            icons.forEach(icon => icon.style.display = 'block');
        }
    }

        const daysSet = new Set();
        
        data.forEach(row => {
            const category = String(row[4] || 'Uncategorized').trim() || 'Uncategorized';
            const amount = parseFloat(row[5]) || 0;
            const date = String(row[2] || '').trim();
            
            totalSpent += amount;
            if (category) {
                categorySums[category] = (categorySums[category] || 0) + amount;
            }
            if (date) {
                daysSet.add(date);
            }
        });
        
        const uniqueCategoriesCount = Object.keys(categorySums).length;
        const daysLogged = daysSet.size;
        const dailyAverage = daysLogged > 0 ? (totalSpent / daysLogged) : 0;
        
        // 2. Populate KPI cards
        const totalSpentEl = document.getElementById('summary-total-spent');
        const totalCategoriesEl = document.getElementById('summary-total-categories');
        const daysLoggedEl = document.getElementById('summary-days-logged');
        const dailyAvgEl = document.getElementById('summary-daily-average');
        
        if (totalSpentEl) totalSpentEl.textContent = formatCurrency(totalSpent);
        if (totalCategoriesEl) totalCategoriesEl.textContent = uniqueCategoriesCount;
        if (daysLoggedEl) daysLoggedEl.textContent = daysLogged;
        if (dailyAvgEl) dailyAvgEl.textContent = formatCurrency(dailyAverage);
        
        // 3. Render categories list with progress bars
        const categoryListContainer = document.getElementById('summary-category-list');
        if (categoryListContainer) {
            categoryListContainer.innerHTML = '';
            
            if (uniqueCategoriesCount === 0) {
                categoryListContainer.innerHTML = '<div class="text-muted text-center py-4 small">No categories found.</div>';
            } else {
                // Sort categories descending
                const sortedCats = Object.keys(categorySums).sort((a, b) => categorySums[b] - categorySums[a]);
                
                // Color palette matching chart
                const colors = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#06b6d4', '#64748b'];
                
                sortedCats.forEach((cat, index) => {
                    const amt = categorySums[cat];
                    const pct = totalSpent > 0 ? ((amt / totalSpent) * 100).toFixed(1) : 0;
                    const color = colors[index % colors.length];
                    
                    const catRow = document.createElement('div');
                    catRow.className = 'summary-category-item';
                    catRow.innerHTML = `
                        <div class="w-100">
                            <div class="d-flex justify-content-between align-items-center mb-0">
                                <span class="fw-semibold text-truncate" style="max-width: 65%; font-size: 0.74rem;"><i class="fas fa-tag me-1" style="color: ${color}; font-size: 0.72rem;"></i>${cat}</span>
                                <span class="fw-bold" style="font-size: 0.74rem;">${formatCurrency(amt)} <span class="text-muted fw-normal" style="font-size: 0.62rem;">(${pct}%)</span></span>
                            </div>
                            <div class="progress" style="height: 2px; background-color: rgba(0,0,0,0.04); border-radius: 1px; margin-top: 1px;">
                                <div class="progress-bar" role="progressbar" style="width: ${pct}%; background-color: ${color}; border-radius: 1px;" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>
                    `;
                    categoryListContainer.appendChild(catRow);
                });
            }
        }
        
        // 4. Render Top 5 Transactions
        const topExpensesList = document.getElementById('summary-top-expenses-list');
        if (topExpensesList) {
            topExpensesList.innerHTML = '';
            
            // Sort data copies by amount descending
            const top5 = [...data]
                .filter(row => parseFloat(row[5]) > 0)
                .sort((a, b) => (parseFloat(b[5]) || 0) - (parseFloat(a[5]) || 0))
                .slice(0, 5);
                
            if (top5.length === 0) {
                topExpensesList.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4 small">No expenses logged yet.</td></tr>';
            } else {
                top5.forEach(row => {
                    const date = row[2] || '';
                    const item = row[4] || '';
                    const amount = parseFloat(row[5]) || 0;
                    
                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid rgba(0,0,0,0.03)';
                    tr.innerHTML = `
                        <td style="padding: 2px 6px; white-space: nowrap; color: var(--dark-color); opacity: 0.85; font-size: 0.75rem;">${date}</td>
                        <td style="padding: 2px 6px; font-weight: 500; color: var(--dark-color); font-size: 0.75rem;">${item}</td>
                        <td style="padding: 2px 6px; color: var(--dark-color); opacity: 0.85; font-size: 0.75rem;"><span class="badge bg-secondary-soft text-secondary px-2" style="font-weight: 600; font-size: 0.62rem; border-radius: 4px; background: rgba(79, 70, 229, 0.08); color: #4f46e5 !important; border: 1px solid rgba(79, 70, 229, 0.15); padding: 1px 3px;">${item}</span></td>
                        <td class="text-end fw-bold" style="padding: 2px 6px; color: var(--danger-color); font-size: 0.75rem;">${formatCurrency(amount)}</td>
                    `;
                    topExpensesList.appendChild(tr);
                });
            }
        }
        
        // 5. Draw Doughnut Chart using Chart.js
        if (window.monthSummaryChartInstance) {
            window.monthSummaryChartInstance.destroy();
        }
        
        try {
            const canvas = document.getElementById('monthSummaryDoughnutChart');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                
                // Get top categories and combine the rest as "Others"
                const sortedCats = Object.keys(categorySums).sort((a, b) => categorySums[b] - categorySums[a]);
                const top5Cats = sortedCats.slice(0, 5);
                const top5Sums = top5Cats.map(cat => categorySums[cat]);
                
                let otherSum = 0;
                sortedCats.slice(5).forEach(cat => {
                    otherSum += categorySums[cat];
                });
                
                const labels = [...top5Cats];
                const chartData = [...top5Sums];
                if (otherSum > 0) {
                    labels.push('Others');
                    chartData.push(otherSum);
                }
                
                if (labels.length === 0) {
                    labels.push('No Expenses');
                    chartData.push(1);
                }
                
                const colors = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#06b6d4', '#64748b'];
                const isDark = document.body.getAttribute('data-theme') === 'dark';
                
                window.monthSummaryChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: chartData,
                            backgroundColor: labels[0] === 'No Expenses' ? ['#e2e8f0'] : colors.slice(0, labels.length),
                            borderWidth: 1,
                            borderColor: isDark ? '#1e293b' : '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'bottom',
                                labels: {
                                    boxWidth: 8,
                                    padding: 8,
                                    color: isDark ? '#cbd5e1' : '#64748b',
                                    font: {
                                        size: 9,
                                        family: "'Plus Jakarta Sans', sans-serif",
                                        weight: '600'
                                    }
                                }
                            },
                            tooltip: {
                                enabled: labels[0] !== 'No Expenses',
                                callbacks: {
                                    label: function(context) {
                                        const label = context.label || '';
                                        const val = context.parsed || 0;
                                        const pct = totalSpent > 0 ? ((val / totalSpent) * 100).toFixed(1) : 0;
                                        return ` ${label}: ${formatCurrency(val)} (${pct}%)`;
                                    }
                                }
                            }
                        },
                        cutout: '70%'
                    }
                });
            }
        } catch (e) {
            console.error("Failed to render month summary chart:", e);
        }
        
        // 6. Open the Modal
        const modalEl = document.getElementById('monthSummaryModal');
        if (modalEl) {
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            modal.show();
        }
    }

    function showItemSummaryModal(month) {
        const titleEl = document.getElementById('item-summary-title');
        if (titleEl) {
            titleEl.textContent = `${month || CURRENT_MONTH} Item-wise Summary`;
        }
        
        const data = expenseData || [];
        const itemSums = {};
        let grandTotal = 0;
        
        data.forEach(row => {
            const item = String(row[4] || 'Uncategorized').trim() || 'Uncategorized';
            const amount = parseFloat(row[5]) || 0;
            
            itemSums[item] = (itemSums[item] || 0) + amount;
            grandTotal += amount;
        });
        
        // Sort items alphabetically (A-Z)
        const sortedItems = Object.keys(itemSums).sort((a, b) => a.localeCompare(b, undefined, {sensitivity: 'base'}));
        
        const listContainer = document.getElementById('item-summary-list');
        if (listContainer) {
            listContainer.innerHTML = '';
            
            if (sortedItems.length === 0) {
                listContainer.innerHTML = '<div class="text-center py-4 text-muted small">No records found.</div>';
            } else {
                sortedItems.forEach(item => {
                    const amt = itemSums[item];
                    const pct = grandTotal > 0 ? ((amt / grandTotal) * 100).toFixed(1) : 0;
                    
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'item-pivot-row d-flex align-items-center justify-content-between rounded-2';
                    rowDiv.style.background = 'var(--light-color)';
                    rowDiv.style.border = '1px solid var(--glass-border)';
                    rowDiv.style.transition = 'all 0.2s ease';
                    rowDiv.style.padding = '2px 6px';
                    rowDiv.style.marginBottom = '2px';
                    rowDiv.innerHTML = `
                        <div class="w-100">
                            <div class="d-flex justify-content-between align-items-center mb-0">
                                <span class="fw-semibold text-truncate" style="max-width: 60%; font-size: 0.74rem; color: var(--dark-color);">${item}</span>
                                <span class="fw-bold" style="font-size: 0.74rem; color: var(--dark-color);">${formatCurrency(amt)} <span class="text-muted fw-normal" style="font-size: 0.62rem;">(${pct}%)</span></span>
                            </div>
                            <div class="progress" style="height: 2px; background-color: rgba(0,0,0,0.04); border-radius: 1px; margin-top: 1px;">
                                <div class="progress-bar" role="progressbar" style="width: ${pct}%; background-color: #eab308; border-radius: 1px;" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>
                    `;
                    listContainer.appendChild(rowDiv);
                });
            }
        }
        
        const totalEl = document.getElementById('item-summary-grand-total');
        if (totalEl) {
            totalEl.textContent = formatCurrency(grandTotal);
        }
        
        const modalEl = document.getElementById('itemSummaryModal');
        if (modalEl) {
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            modal.show();
        }
    }
</script>
